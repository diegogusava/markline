name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
env:
  VERSION: 0.1.${{ github.run_number }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Set version
        shell: bash
        run: |
          sed -i "s/\"version\": \"0.1.0\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
      - run: npm ci || npm i
      - run: node build-app.js
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: markline-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Arch deps
        run: pacman -Syu --noconfirm --needed base-devel git webkit2gtk-4.1 gtk3 rust nodejs npm
      - uses: actions/checkout@v4
      - name: Build package
        run: |
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          useradd -m builder && chown -R builder .
          su builder -c 'makepkg --noconfirm'
      - uses: actions/upload-artifact@v4
        with:
          name: markline-arch
          if-no-files-found: error
          path: markline-*.pkg.tar.zst

  # Only main is released, and only when every platform built. Each build gets
  # its own tag (v0.1.N) and release; GitHub marks the newest one "Latest", so
  # /releases/latest always shows just that build's files.
  release:
    needs: [build, arch]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish v${{ env.VERSION }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run of this workflow: replace the files on the same release.
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* \
              --target "$GITHUB_SHA" \
              --title "Markline $VERSION" \
              --generate-notes \
              --latest
          fi
      - name: Remove the old rolling "latest" release
        run: gh release delete latest --cleanup-tag --yes || true
